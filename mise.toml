[env]
# docker compose 用
HOST = "0.0.0.0"
PORT = "8080"
DATABASE_PORT_OUTER = "5432"
DATABASE_PORT_INNER = "5432"
REDIS_PORT_OUTER = "6379"
REDIS_PORT_INNER = "6379"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317"

# アプリ (AppConfig) 用
DATABASE_HOST = "localhost"
DATABASE_PORT = "5432"
DATABASE_USERNAME = "app"
DATABASE_PASSWORD = "passwd"
DATABASE_NAME = "app"
DATABASE_URL = "postgres://app:passwd@localhost:5432/app"
REDIS_HOST = "localhost"
REDIS_PORT = "6379"
AUTH_TOKEN_TTL = "86400"

# psql (libpq) 用
PGHOST = "localhost"
PGPORT = "5432"
PGUSER = "app"
PGPASSWORD = "passwd"
PGDATABASE = "app"

[tasks.up]
description = "Start PostgreSQL and Redis"
run = "docker compose up -d postgres redis"

[tasks.down]
description = "Stop containers"
run = "docker compose down"

[tasks.reset]
description = "Remove containers and volumes"
run = "docker compose down -v"

[tasks.logs]
description = "Follow container logs"
run = "docker compose logs -f"

[tasks.build]
description = "Build"
dir = "backend"
run = "cargo build"

[tasks.check]
description = "Type check"
dir = "backend"
run = "cargo check --all --all-targets"

[tasks.migrate]
description = "Apply database migrations (waits for PostgreSQL)"
dir = "backend"
run = """
until sqlx migrate run --source infra/migrations; do
  sleep 1
done
"""

[tasks.seed]
description = "Insert initial data"
dir = "backend"
run = "psql \"$DATABASE_URL\" -f data/initial_setup.sql"

[tasks.run]
description = "Start PostgreSQL, migrate, then run the app"
depends = ["up", "migrate"]
dir = "backend"
run = "cargo run"

[tasks.run-release]
description = "Start PostgreSQL, migrate, then run the app in release mode"
depends = ["up", "migrate"]
dir = "backend"
run = "cargo run --release"

[tasks.test]
description = "Run tests"
dir = "backend"
run = "cargo nextest run --workspace --status-level all --test-threads=num-cpus --no-tests=pass"

[tasks.fmt]
description = "Format"
dir = "backend"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting"
dir = "backend"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint"
dir = "backend"
run = "cargo clippy --all --all-targets"

[tasks.lint]
description = "Lint with warnings denied"
dir = "backend"
run = "cargo clippy --all --all-targets -- -D warnings"

[tasks.ci]
description = "Run all CI checks"
run = [
  { task = "up" },
  { task = "migrate" },
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
]

[tasks.db]
description = "Open psql"
run = "psql"

[tasks.redis]
description = "Open redis-cli"
run = "redis-cli"

[tasks.create-hash]
description = "Generate a bcrypt hash for a password"
dir = "backend"
run = "rust-script scripts/create-hash.rs"

[tasks.actions-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor .github/workflows", "pinact run --check"]

[tasks.pinact]
description = "Pin and update GitHub Actions to latest"
run = "pinact run --update"
