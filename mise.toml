[tools]
node = "24"

[env]
# corepack: fetch the pnpm version pinned in frontend/package.json without prompting
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
# docker compose 用
HOST = "0.0.0.0"
PORT = "8080"
DATABASE_PORT_OUTER = "5432"
DATABASE_PORT_INNER = "5432"
REDIS_PORT_OUTER = "6379"
REDIS_PORT_INNER = "6379"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317"

# アプリ (AppConfig) 用
DATABASE_HOST = "localhost"
DATABASE_PORT = "5432"
DATABASE_USERNAME = "app"
DATABASE_PASSWORD = "passwd"
DATABASE_NAME = "app"
DATABASE_URL = "postgres://app:passwd@localhost:5432/app"
REDIS_HOST = "localhost"
REDIS_PORT = "6379"
AUTH_TOKEN_TTL = "86400"

# psql (libpq) 用
PGHOST = "localhost"
PGPORT = "5432"
PGUSER = "app"
PGPASSWORD = "passwd"
PGDATABASE = "app"

# --- 共有インフラ (docker compose) --------------------------------------------

[tasks.up]
description = "Start PostgreSQL, Redis and Jaeger"
run = "docker compose up -d postgres redis jaeger"

[tasks.down]
description = "Stop containers"
run = "docker compose down"

[tasks.reset]
description = "Remove containers and volumes"
run = "docker compose down -v"

[tasks.logs]
description = "Follow container logs"
run = "docker compose logs -f"

# --- バックエンド --------------------------------------------------------------

[tasks.back-build]
description = "Build the backend"
dir = "backend"
run = "cargo build"

[tasks.back-check]
description = "Type check the backend"
dir = "backend"
run = "cargo check --all --all-targets"

[tasks.back-migrate]
description = "Apply database migrations (waits for PostgreSQL)"
dir = "backend"
run = """
until sqlx migrate run --source infra/migrations; do
  sleep 1
done
"""

[tasks.back-seed]
description = "Insert initial data"
dir = "backend"
run = "psql \"$DATABASE_URL\" -f data/initial_setup.sql"

[tasks.back-run]
description = "Start PostgreSQL, migrate, then run the API"
depends = ["up", "back-migrate"]
dir = "backend"
run = "cargo run"

[tasks.back-run-release]
description = "Start PostgreSQL, migrate, then run the API in release mode"
depends = ["up", "back-migrate"]
dir = "backend"
run = "cargo run --release"

[tasks.back-run-in-docker]
description = "Build the API image and run it in Docker"
depends = ["up", "back-migrate"]
run = "docker compose up -d --build app"

[tasks.back-test]
description = "Run backend tests"
dir = "backend"
run = "cargo nextest run --workspace --status-level all --test-threads=num-cpus --no-tests=pass"

[tasks.back-fmt]
description = "Format the backend"
dir = "backend"
run = "cargo fmt --all"

[tasks.back-fmt-check]
description = "Check backend formatting"
dir = "backend"
run = "cargo fmt --all -- --check"

[tasks.back-clippy]
description = "Lint the backend"
dir = "backend"
run = "cargo clippy --all --all-targets"

[tasks.back-lint]
description = "Lint the backend with warnings denied"
dir = "backend"
run = "cargo clippy --all --all-targets -- -D warnings"

[tasks.back-db]
description = "Open psql"
run = "psql"

[tasks.back-redis]
description = "Open redis-cli"
run = "redis-cli"

[tasks.back-create-hash]
description = "Generate a bcrypt hash for a password"
dir = "backend"
run = "rust-script scripts/create-hash.rs"

[tasks.back-ci]
description = "Run all backend CI checks"
run = [
  { task = "up" },
  { task = "back-migrate" },
  { task = "back-fmt-check" },
  { task = "back-lint" },
  { task = "back-test" },
]

# --- フロントエンド ------------------------------------------------------------

[tasks.front-install]
description = "Install frontend dependencies"
dir = "frontend"
run = "pnpm install"

[tasks.front-dev]
description = "Start the frontend dev server (http://localhost:5173)"
dir = "frontend"
run = "pnpm dev"

[tasks.front-build]
description = "Build the frontend"
dir = "frontend"
run = "pnpm build"

[tasks.front-serve]
description = "Build and serve the frontend (adapter-node)"
depends = ["front-build"]
dir = "frontend"
# PORT is set to 8080 for the backend above, and adapter-node reads the same
# variable, so the frontend server needs its own.
run = "PORT=3000 node build"

[tasks.front-fmt]
description = "Format the frontend"
dir = "frontend"
run = "pnpm fmt"

[tasks.front-lint]
description = "Lint the frontend"
dir = "frontend"
run = "pnpm lint"

[tasks.front-typecheck]
description = "Type check the frontend (svelte-check)"
dir = "frontend"
run = "pnpm typecheck"

[tasks.front-check]
description = "Format, lint and type check the frontend"
dir = "frontend"
run = "pnpm check && pnpm typecheck"

[tasks.front-test]
description = "Run frontend tests"
dir = "frontend"
run = "pnpm test"

[tasks.front-ci]
description = "Run all frontend CI checks"
run = [
  { task = "front-check" },
  { task = "front-test" },
  { task = "front-build" },
]

# --- リポジトリ全体 ------------------------------------------------------------

[tasks.ci]
description = "Run all CI checks (backend + frontend)"
run = [{ task = "back-ci" }, { task = "front-ci" }]

[tasks.actions-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor .github/workflows", "pinact run --check"]

[tasks.pinact]
description = "Pin and update GitHub Actions to latest"
run = "pinact run --update"
